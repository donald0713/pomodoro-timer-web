<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Setting</title>
  <link rel="stylesheet" href="setting.css" />
</head>
<body>
  <div class="app">
    <h3>Setting</h3>

    <label for="timer-minutes">집중 시간 (분)</label>
    <input type="number" id="timer-minutes" min="1" oninput="updateSaveButtonState()" />

    <label for="break-minutes">휴식 시간 (분)</label>
    <input type="number" id="break-minutes" min="1" oninput="updateSaveButtonState()" />

    <button type="button" id="save-btn" onclick="saveSetting()">설정 완료</button>
  </div>

  <script src="setting.js"></script>
</body>
</html>
